<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>calc.bmctiernan.com | calculator</title>
<style>
  /* Same look as the bmctiernan.com pages (server-of-love sites/), in green (CALC-02). */
  :root {
    --bg1: #dcf7e6; --bg2: #f4fff0; --ink: #1f3b2c; --soft: #557a63;
    --accent: #22a861; --accent-soft: #c8f0d7; --card: #fbfffc; --line: #b9e6c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: grid; place-items: center; padding: 32px 16px; overflow-x: hidden;
  }
  .sym { position: fixed; bottom: -40px; font-size: 22px; font-weight: 700; color: var(--accent); opacity: .45; animation: float 14s linear infinite; }
  .sym:nth-child(1) { left: 8%;  animation-delay: 0s; }
  .sym:nth-child(2) { left: 28%; animation-delay: 4s; font-size: 16px; }
  .sym:nth-child(3) { left: 55%; animation-delay: 8s; }
  .sym:nth-child(4) { left: 78%; animation-delay: 2s; font-size: 18px; }
  .sym:nth-child(5) { left: 92%; animation-delay: 10s; font-size: 14px; }
  @keyframes float { to { transform: translateY(-115vh) rotate(20deg); } }
  @media (prefers-reduced-motion: reduce) { .sym { display: none; } }
  main {
    position: relative; width: 100%; max-width: 640px; background: var(--card);
    border: 2px solid var(--line); border-radius: 28px; padding: 36px 32px;
    box-shadow: 0 12px 0 var(--accent-soft);
  }
  @media (max-width: 520px) { main { padding: 28px 18px; } }
  .badge {
    display: inline-block; background: var(--accent-soft); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; letter-spacing: .02em;
  }
  h1 { font-size: clamp(30px, 6vw, 42px); margin: 16px 0 6px; line-height: 1.1; }
  .host { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--soft); margin: 0 0 24px; }
  p { line-height: 1.6; margin: 0 0 12px; }
  form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; margin-top: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font-size: 13px; font-weight: 700; color: var(--soft); }
  input, select {
    font: inherit; font-size: 18px; font-weight: 700; color: var(--ink); background: #fff;
    border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    grid-column: 1 / -1; justify-self: start;
    font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer;
    background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 999px;
    padding: 10px 22px; box-shadow: 0 4px 0 var(--accent); transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 520px) { form { grid-template-columns: 1fr; } }
  #result { margin-top: 24px; padding: 14px 18px; border-radius: 18px; border: 2px solid var(--line); background: #fff; }
  #result.agree { background: var(--accent-soft); border-color: var(--accent); }
  #result.disagree, #result.error { background: #ffe4ea; border-color: #f07a93; }
  #result.hidden { display: none; }
  #result p { margin: 4px 0; }
  .label { color: var(--soft); }
  .warning { color: #b91c1c; font-weight: 700; }
  .switch {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; margin-right: 8px;
    border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 15px; text-decoration: none;
    transition: transform .15s, box-shadow .15s;
  }
  .switch:hover { transform: translateY(2px); }
  .switch.pink { background: #ffd1e3; color: #4a2c3d; border: 2px solid #ff6fa5; box-shadow: 0 4px 0 #ff6fa5; }
  .switch.pink:hover { box-shadow: 0 2px 0 #ff6fa5; }
  .switch.lav { background: #ddd3ff; color: #33304f; border: 2px solid #8b6cff; box-shadow: 0 4px 0 #8b6cff; }
  .switch.lav:hover { box-shadow: 0 2px 0 #8b6cff; }
  .switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  footer {
    margin-top: 28px; padding-top: 16px; border-top: 2px dashed var(--line);
    font-size: 14px; color: var(--soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  #release-footer { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <div class="sym" aria-hidden="true">+</div>
  <div class="sym" aria-hidden="true">&minus;</div>
  <div class="sym" aria-hidden="true">&times;</div>
  <div class="sym" aria-hidden="true">&divide;</div>
  <div class="sym" aria-hidden="true">=</div>

  <main>
    <span class="badge">&#10010; the calculator is open</span>
    <h1>Calculator</h1>
    <p class="host">calc.bmctiernan.com</p>
    <p>your browser works out the answer first, then my server checks its work. if they don't agree, you'll see it.</p>

    <form id="calc-form">
      <div class="field">
        <label for="a">first number</label>
        <input id="a" type="number" step="any" required value="6" />
      </div>
      <div class="field">
        <label for="operation">operation</label>
        <select id="operation">
          <option value="add">+</option>
          <option value="subtract">−</option>
          <option value="multiply" selected>×</option>
          <option value="divide">÷</option>
        </select>
      </div>
      <div class="field">
        <label for="b">second number</label>
        <input id="b" type="number" step="any" required value="7" />
      </div>
      <button type="submit" id="calculate-btn">calculate &rarr;</button>
    </form>

    <div id="result" class="hidden" role="status">
      <p><span class="label">Browser:</span> <strong id="browser-result"></strong></p>
      <p><span class="label">Server:</span> <strong id="api-result"></strong></p>
      <p id="status"></p>
    </div>

    <a class="switch pink" href="https://bmctiernan.com">&#9825; back to the main door &rarr;</a>
    <a class="switch lav" href="https://quiz.bmctiernan.com">&#9734; take the toothpaste quiz &rarr;</a>

    <footer>
      <span>bridge</span>
      <span id="release-footer"></span>
    </footer>
  </main>

<script>
  const LIMIT = 1000000;
  const OPERATIONS = {
    add: (a, b) => a + b,
    subtract: (a, b) => a - b,
    multiply: (a, b) => a * b,
    divide: (a, b) => a / b,
  };

  // The browser's own answer (CALC-10). Returns { value } or { error }.
  function calculateInBrowser(a, b, operation) {
    if (!Number.isFinite(a) || !Number.isFinite(b) || Math.abs(a) > LIMIT || Math.abs(b) > LIMIT) {
      return { error: "Numbers must be finite and within ±1,000,000." };
    }
    if (operation === "divide" && b === 0) return { error: "Cannot divide by zero." };
    return { value: OPERATIONS[operation](a, b) };
  }

  // Text only, never HTML (CALC-12).
  function show(state, browserText, apiText, statusText) {
    const result = document.getElementById("result");
    result.className = state;
    document.getElementById("browser-result").textContent = browserText;
    document.getElementById("api-result").textContent = apiText;
    const status = document.getElementById("status");
    status.textContent = statusText;
    status.className = state === "agree" ? "" : "warning";
  }

  async function handleSubmit(event) {
    event.preventDefault();
    const a = document.getElementById("a").valueAsNumber;
    const b = document.getElementById("b").valueAsNumber;
    const operation = document.getElementById("operation").value;
    const browser = calculateInBrowser(a, b, operation);
    const browserText = "error" in browser ? browser.error : String(browser.value);

    let response;
    try {
      response = await fetch("/api/calculate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Only the inputs go to the server; it recalculates on its own (CALC-10).
        body: JSON.stringify({ a, b, operation }),
      });
    } catch {
      show("error", browserText, "unreachable", "Could not reach the server.");
      return;
    }
    const body = await response.json().catch(() => ({}));

    if (response.ok) {
      const agree = "value" in browser && browser.value === body.result;
      show(agree ? "agree" : "disagree", browserText, String(body.result),
        agree ? "Results match" : "Browser and server disagree. Not trusting either blindly.");
    } else if (response.status === 400 && body.detail && body.detail.message) {
      const agree = "error" in browser && browser.error === body.detail.message;
      show("error", browserText, body.detail.message, agree ? "Both refused it" : "Browser and server disagree.");
    } else {
      show("error", browserText, "rejected", "Enter numbers between -1,000,000 and 1,000,000.");
    }
  }

  async function loadFooter() {
    const response = await fetch("/health");
    const health = await response.json();
    document.getElementById("release-footer").textContent =
      `commit ${health.commit} · built ${health.built_at}`;
  }

  document.getElementById("calc-form").addEventListener("submit", handleSubmit);
  loadFooter();
</script>
</body>
</html>
