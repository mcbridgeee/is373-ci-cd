# Three services on one machine, kept separate on purpose:
#   dev   your live-editing copy, built from local source  -> http://127.0.0.1:8080
#   prod  the published image from Docker Hub (:prod)      -> http://127.0.0.1:8090
#   qa    the published QA image from Docker Hub (:qa)     -> http://127.0.0.1:8092
#   wud   What's Up Docker, watches prod for new images    -> http://127.0.0.1:8091
# Recreating prod never touches dev, and vice versa.
name: is373-ci-cd

services:
  dev:
    build:
      context: .
    image: is373-ci-cd-dev:local
    ports:
      - "127.0.0.1:${DEV_PORT:-8080}:8000"
    environment:
      APP_ENV: development
      BUILD_COMMIT: dev
      BUILD_TIME: live-reload
    volumes:
      # Read-only mount of your source, so edits show up without rebuilding.
      - ./app:/app/app:ro
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --reload]
    labels:
      wud.watch: "false"
    restart: unless-stopped

  prod:
    # Only ever a published, tested image. Exists on Docker Hub once issue #6 publishes it.
    image: ${PROD_IMAGE:-mcbridgeee/is373-ci-cd:prod}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "127.0.0.1:8090:8000"
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: "^prod$$"
      wud.trigger.include: docker.production

  qa:
    # QA channel: CI moves :qa on every passing push to the qa branch. Same
    # image and hardening as prod, its own container, so QA never touches prod.
    image: ${QA_IMAGE:-mcbridgeee/is373-ci-cd:qa}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      APP_ENV: qa
    ports:
      - "127.0.0.1:8092:8000"
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: "^qa$$"
      wud.trigger.include: docker.production

  wud:
    image: getwud/wud:9.2.1@sha256:12e46c33da641687b2123617b917e11039bab2f7a2099dffed68a9631f3116b5
    ports:
      - "127.0.0.1:8091:3000"
    env_file:
      - path: ./.state/wud.env
        required: false
    environment:
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
      WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT: "true"
      # Every 5 minutes: digest checks hit Docker Hub anonymously, which is rate limited per IP.
      WUD_WATCHER_LOCAL_CRON: "*/5 * * * *"
      WUD_WATCHER_LOCAL_JITTER: "1000"
      WUD_TRIGGER_DOCKER_PRODUCTION_AUTO: "true"
      WUD_TRIGGER_DOCKER_PRODUCTION_PRUNE: "false"
      WUD_TRIGGER_DOCKER_PRODUCTION_DRYRUN: "false"
    volumes:
      # WUD needs the Docker socket to replace prod. This is powerful host
      # access, which is why WUD is only reachable on 127.0.0.1.
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-data:/store
    labels:
      wud.watch: "false"
    restart: unless-stopped

volumes:
  wud-data:
