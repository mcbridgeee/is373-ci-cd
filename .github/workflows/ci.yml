name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  # One production group for main pushes (never cancel a publication);
  # PRs and manual runs cancel their own superseded runs.
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  verify:
    # Keep this name stable: branch protection requires the "verify" check.
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: is373-ci-cd:ci
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        run: pipx install uv==0.12.15

      - name: Install locked test dependencies
        run: make setup

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Install Chromium and its system libraries
        run: uv run --frozen playwright install --with-deps --only-shell chromium

      - name: Build release image once (linux/amd64)
        run: make build

      - name: E2E tests against the release image
        run: make test-e2e

      - name: Install checksum-pinned image scanner
        run: sh scripts/install-trivy.sh

      - name: Scan the exact tested image (blocks fixable HIGH/CRITICAL)
        run: python3 scripts/scan-image.py "$IMAGE" artifacts/security

      - name: Export the exact tested image (no rebuild later)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-artifact
          docker save -o release-artifact/image.tar "$IMAGE"
          cp .state/tested-image.json release-artifact/tested-image.json

      - name: Retain tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-amd64
          path: release-artifact/
          compression-level: 0
          retention-days: 2

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # Only a passing push to main publishes. PRs never see the Docker Hub token.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-amd64
          path: release-artifact

      - name: Log in to Docker Hub only after tests pass
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: printf '%s' "$DOCKER_PAT" | docker login --username mcbridgeee --password-stdin

      - name: Publish the tested image, then move prod
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py

      - name: Log out of Docker Hub
        if: always()
        run: docker logout
