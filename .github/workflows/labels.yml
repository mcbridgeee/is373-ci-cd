name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - scripts/sync-labels.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply .github/labels.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-labels.py
